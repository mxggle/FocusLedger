[package]
name = "yolo"
version = "0.6.0"
description = "An AI-native desktop app for mastering your time — turn daily tasks into honest time records."
authors = ["Yolo"]
edition = "2021"

[lib]
name = "yolo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

# macOS-only: used to inset the native traffic-light buttons so they sit inside
# the floating sidebar. Not compiled on Windows/Linux.
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
